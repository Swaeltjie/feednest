name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test both search backends: the default build falls back to LIKE,
        # while sqlite_fts5 exercises the FTS5 full-text path used in production.
        tags: ["", "sqlite_fts5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go test -tags "${{ matrix.tags }}" ./...
        working-directory: backend
        env:
          CGO_ENABLED: "1"

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
